# 全国マーケティング旅（Cloudflare Workers）
# name は Cloudflare ダッシュボードにある Worker の名前と同じにしてください。
name = "marketing-trip"
main = "src/index.js"
compatibility_date = "2025-09-01"

# LP・編集ページなどのファイル
[assets]
directory = "./public"
binding = "ASSETS"

# データベース（D1）
[[d1_databases]]
binding = "DB"
database_name = "marketing-trip"
database_id = "ここにD1のデータベースIDを入れる"
migrations_dir = "migrations"

# 編集できる人の確認（Cloudflare Access）
[vars]
ACCESS_TEAM_DOMAIN = "https://（チーム名）.cloudflareaccess.com"
ACCESS_AUD = "ここにAccessアプリケーションのAUDタグを入れる"
